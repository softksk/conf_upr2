[settings]
# Пример конфигурации для работы с реальным репозиторием Ubuntu

# Имя анализируемого пакета
package_name = curl

# URL репозитория Ubuntu
repository_url = http://archive.ubuntu.com/ubuntu

# Режим работы с тестовым репозиторием (false для реального)
test_mode = false

# Версия Ubuntu (focal, jammy, bionic, etc.)
package_version = focal

# Вывод зависимостей в формате ASCII-дерева (true/false)
ascii_tree = true

# Максимальная глубина анализа зависимостей
max_depth = 2

# Подстрока для фильтрации пакетов (например, "lib" для исключения библиотек)
filter_substring =