[settings]
# Имя анализируемого пакета
package_name = A

# URL репозитория или путь к тестовому файлу
repository_url = test_repo.json

# Режим работы с тестовым репозиторием (true/false)
test_mode = true

# Версия Ubuntu (focal, jammy, etc.) - используется только для реального репозитория
package_version = focal

# Вывод зависимостей в формате ASCII-дерева (true/false)
ascii_tree = true

# Максимальная глубина анализа зависимостей
max_depth = 5

# Подстрока для фильтрации пакетов (оставить пустым для отключения)
filter_substring =